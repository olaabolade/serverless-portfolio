<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f4f4f4;
            padding: 20px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        header {
            text-align: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #eaeaea;
        }
        #owner-avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 1rem;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 0.5rem;
        }
        #owner-title {
            color: #7f8c8d;
            font-weight: normal;
            margin-bottom: 1rem;
        }
        section {
            margin-bottom: 2.5rem;
        }
        h2 {
            color: #2c3e50;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #eaeaea;
        }
        #owner-bio {
            line-height: 1.6;
        }
        #owner-bio p {
            margin-bottom: 1rem;
            text-align: justify;
        }
        .project {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 1rem;
            border-left: 4px solid #3498db;
        }
        .project h3 {
            color: #2c3e50;
        }
        .project p {
            margin: 0.5rem 0;
        }
        .tech-stack {
            font-size: 0.9em;
            color: #666;
            font-style: italic;
        }
        #skills-list {
            list-style: none;
            padding-left: 0;
        }
        #skills-list li {
            margin-bottom: 0.5rem;
            padding-left: 1rem;
            border-left: 3px solid #3498db;
        }
        .contact a {
            color: #3498db;
            text-decoration: none;
            margin-right: 15px;
        }
        .contact a:hover {
            text-decoration: underline;
        }
        footer {
            text-align: center;
            margin-top: 2rem;
            color: #7f8c8d;
            font-size: 0.9em;
        }
        @media (max-width: 768px) {
            body { padding: 10px; }
            .container { padding: 15px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <img id="owner-avatar" src="images/avatar-placeholder.jpg" alt="Avatar">
            <h1 id="owner-name">Loading...</h1>
            <p id="owner-title">Loading...</p>
        </header>

        <section class="about">
            <h2>About Me</h2>
            <div id="owner-bio">Loading bio...</div>
        </section>

        <section class="projects">
            <h2>Featured Projects</h2>
            <div id="projects-container">
            </div>
        </section>

        <section class="skills">
            <h2>Core Skills & Technologies</h2>
            <ul id="skills-list">
            </ul>
        </section>

        <section class="contact">
            <h2>Get In Touch</h2>
            <p>
                <a id="linkedin-link" href="#">LinkedIn</a>
                <a id="github-link" href="#">GitHub</a>
                <a id="twitter-link" href="#">Twitter</a>
                <a id="owner-email" href="#">Email</a>
            </p>
            <p><a id="resume-link" href="#">Download My Resume</a></p>
        </section>

        <footer>
            <p>© <span id="current-year"></span> <span id="owner-name-footer"></span>. Hosted proudly on AWS.</p>
        </footer>
    </div>

    <script>
        fetch('config.json')
            .then(response => response.json())
            .then(config => {
                document.getElementById('owner-name').innerText = config.owner.name;
                document.getElementById('owner-name-footer').innerText = config.owner.name;
                document.getElementById('owner-title').innerText = config.owner.title;
                document.getElementById('owner-bio').innerHTML = config.owner.bio;
                
                if (config.owner.avatar) {
                    document.getElementById('owner-avatar').src = config.owner.avatar;
                }
                
                document.getElementById('github-link').href = config.social.github;
                document.getElementById('linkedin-link').href = config.social.linkedin;
                if (config.social.twitter) {
                    document.getElementById('twitter-link').href = config.social.twitter;
                } else {
                    document.getElementById('twitter-link').style.display = 'none';
                }
                document.getElementById('owner-email').href = 'mailto:' + config.owner.email;
                document.getElementById('owner-email').innerText = config.owner.email;
                
                if (config.resume) {
                    document.getElementById('resume-link').href = config.resume;
                }
                
                const projectsContainer = document.getElementById('projects-container');
                projectsContainer.innerHTML = config.projects.map(project => `
                    <div class="project">
                        <h3>${project.name}</h3>
                        <p>${project.description}</p>
                        <p class="tech-stack"><strong>Technologies:</strong> ${project.tech.join(', ')}</p>
                        ${project.link ? `<p><a href="${project.link}" target="_blank">View Project ?</a></p>` : ''}
                    </div>
                `).join('');
                
                const skillsList = document.getElementById('skills-list');
                skillsList.innerHTML = config.skills.map(skill => `
                    <li><strong>${skill.category}:</strong> ${skill.items}</li>
                `).join('');
            })
            .catch(error => {
                console.error('Error loading config.json:', error);
                document.getElementById('owner-bio').innerHTML = '<p>Unable to load configuration. Please ensure config.json exists in the same folder.</p>';
            });
        
        document.getElementById('current-year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
